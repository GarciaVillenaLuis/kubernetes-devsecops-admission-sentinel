apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-workload
  namespace: legacy-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-app
  template:
    metadata:
      labels:
        app: vulnerable-app
    spec:
      hostPID: true
      hostNetwork: true
      volumes:
        - name: host-root
          hostPath:
            path: /
      containers:
        - name: backend
          image: insecure-image:latest
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_ADMIN
          ports:
            - containerPort: 8080
              hostPort: 8080
